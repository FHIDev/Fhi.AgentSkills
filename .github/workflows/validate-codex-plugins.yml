name: Validate Codex plugins

# Behold jobbnavnet: påkrevd status-check på main. Ingen path-filter.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-codex-plugins:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate catalog and packages
        run: python3 .github/scripts/validate_plugins.py codex
