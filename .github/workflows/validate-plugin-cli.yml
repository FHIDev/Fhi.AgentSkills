name: Plugin CLI validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-plugin-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code@2.1.269
      - run: claude plugin validate plugins/skybert --strict
      - run: claude plugin validate plugins/designsystem --strict
